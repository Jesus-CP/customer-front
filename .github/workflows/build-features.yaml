name: build and test feature branch
on:
    push:
        branches:
            -  feature/*
jobs:
        build-feature:
            runs-on: windows-latest
            steps:
                - uses: actions/checkout@v3
                - name: pull and chekout from git repositoy
                  run: |
                        echo "pulling and chking out from git repository"

                - name: setup nodej 18
                  uses: actions/setup-node@v3
                  with:
                    node-version: 18
                - name: install latest angular version
                  run: |
                    npm install -g @angular/cli@latest

                - name: run test and build angular app
                  run: |
                    ng test --watch=false
                    ng build
                    echo "run test and build angular app"